version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: zt-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zt-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: zt-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HOSTNAME: ${KC_HOSTNAME:-192.168.1.9}
      KC_HOSTNAME_PORT: ${KC_PORT:-8080}
    command: start-dev
    ports:
      - "8080:8080"
    networks:
      - zt-net
    depends_on:
      - postgres

  # Vault
  vault:
    image: hashicorp/vault:latest
    container_name: zt-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: myroot
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
    networks:
      - zt-net

  # Redis
  redis:
    image: redis:7-alpine
    container_name: zt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zt-net

  # Backend API
  backend:
    build:
      context: ./servers/backend
      dockerfile: Dockerfile
    container_name: zt-backend
    environment:
      FLASK_APP: app.py
      FLASK_ENV: production
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: myroot
      KEYCLOAK_ADDR: ${KEYCLOAK_ADDR:-http://192.168.1.9:8080}
      KEYCLOAK_REALM: company
      KEYCLOAK_CLIENT_ID: vpn-client
      KEYCLOAK_CLIENT_SECRET: change-me-in-production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_IP: ${SERVER_IP:-192.168.1.9}
    volumes:
      - ./mock-data:/app/mock-data:rw
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - zt-net
    depends_on:
      - vault
      - keycloak
      - redis

  # Frontend
  frontend:
    build:
      context: ./servers/frontend
      dockerfile: Dockerfile.prod
    container_name: zt-frontend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://192.168.1.9:5000}
      REACT_APP_KEYCLOAK_URL: ${REACT_APP_KEYCLOAK_URL:-http://192.168.1.9:8080}
    ports:
      - "3000:3000"
    networks:
      - zt-net
    depends_on:
      - backend

volumes:
  postgres_data:
  vault_data:
  redis_data:

networks:
  zt-net:
    driver: bridge
