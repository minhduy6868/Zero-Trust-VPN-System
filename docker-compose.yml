version: '3.8'

services:
  # ========== PostgreSQL Database ==========
  postgres:
    image: postgres:15-alpine
    container_name: zt-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zero-trust-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Keycloak OIDC Server ==========
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: zt-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_PROXY: edge
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    command: start-dev
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - ./servers/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zero-trust-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ========== HashiCorp Vault ==========
  vault:
    image: hashicorp/vault:latest
    container_name: zt-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: myroot
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "0.0.0.0:8200:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./servers/vault/config:/vault/config
      - ./servers/vault/policies:/vault/policies
      - vault_data:/vault/data
    networks:
      - zero-trust-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8200/v1/sys/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== WireGuard VPN Server ==========
  wireguard:
    image: linuxserver/wireguard:latest
    container_name: zt-wireguard
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Ho_Chi_Minh
      SERVERURL: auto
      SERVERPORT: 51820
      PEERS: 10
      PEERDNS: 1.1.1.1
      INTERNAL_SUBNET: 10.0.0.0
      ALLOWEDIPS: 0.0.0.0/0
    ports:
      - "51820:51820/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - wireguard_config:/config
      - /lib/modules:/lib/modules
    networks:
      - zero-trust-net
    restart: unless-stopped

  # ========== Redis Cache ==========
  redis:
    image: redis:7-alpine
    container_name: zt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zero-trust-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Backend API (Python Flask) ==========
  backend:
    build:
      context: ./servers/backend
      dockerfile: Dockerfile
    container_name: zt-backend
    environment:
      FLASK_APP: app.py
      FLASK_ENV: development
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-myroot}
      KEYCLOAK_ADDR: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-company}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-vpn-client}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change-me-in-production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://keycloak:keycloak123@postgres:5432/keycloak
      SERVER_IP: ${SERVER_IP:-localhost}
    ports:
      - "0.0.0.0:5000:5000"
      - "5000:5000"
    volumes:
      - ./servers/backend:/app
      - ./mock-data:/app/mock-data
    depends_on:
      vault:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zero-trust-net
    restart: unless-stopped

  # ========== Frontend (React) ==========
  frontend:
    build:
      context: ./servers/frontend
      dockerfile: Dockerfile
    container_name: zt-frontend
    environment:
      REACT_APP_API_URL: http://${SERVER_IP:-localhost}:5000
      REACT_APP_KEYCLOAK_URL: http://${SERVER_IP:-localhost}:8080
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - ./servers/frontend/src:/app/src
      - ./servers/frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - zero-trust-net
    restart: unless-stopped

volumes:
  postgres_data:
  vault_data:
  wireguard_config:
  redis_data:

networks:
  zero-trust-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
